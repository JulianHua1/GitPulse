name: Daily Commit Tracker

on:
  schedule:
    # Check often so a delayed or skipped tick does not lose a daily commit.
    - cron: '7,17,27,37,47,57 2-4 * * *'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: gitpulse-daily-activity
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.activity.outputs.changed }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Update due activity
      id: activity
      run: python3 scripts/update_activity.py

  deploy-pages:
    needs: update-activity
    if: needs.update-activity.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout latest code
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Prepare deployment
      run: |
        # Ensure all necessary files are present
        ls -la
        ls -la logs/ || echo "Logs directory missing, will be created"
        
        # Verify essential files exist
        test -f index.html || { echo "index.html missing!"; exit 1; }
        test -f dashboard.css || { echo "dashboard.css missing!"; exit 1; }
        test -f dashboard.js || { echo "dashboard.js missing!"; exit 1; }
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'
        retention-days: 1
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: Verify deployment
      run: |
        echo "Dashboard deployed to: ${{ steps.deployment.outputs.page_url }}"
        echo "Deployment completed at: $(date '+%Y-%m-%d %H:%M:%S UTC')"
